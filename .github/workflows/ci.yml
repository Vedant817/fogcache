name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (quality gates, tests, contracts, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs every quality gate bound to the verify phase: enforcer rules,
      # spotless, checkstyle, spotbugs, unit tests, jacoco coverage, package.
      - name: Maven verify
        run: ./mvnw -B -ntp verify

      # Contract validation: OpenAPI specs must lint clean.
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli lint fogcache-contracts/src/main/resources/openapi/*.yaml

      # Reproducible-build SBOM for the whole reactor. Fully-qualified goal:
      # prefix resolution does not see pluginManagement declarations.
      - name: Generate aggregate SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: fogcache-sbom
          path: target/fogcache-sbom.json
          if-no-files-found: error

  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    # The NVD feed is sometimes rate-limited or flaky; findings are reviewed
    # as a separate track, so a feed failure must not block the main build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dependency check (CVSS >= 7 fails)
        run: ./mvnw -B -ntp -Psecurity verify -DskipTests
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  integration:
    name: Integration (ephemeral stack)
    runs-on: ubuntu-latest
    needs: build
    # Unique project name per run/attempt: parallel jobs and retries never
    # share containers, volumes, or networks (state isolation). On self-hosted
    # runners that share a host, override ports via .env before bootstrapping.
    env:
      COMPOSE_PROJECT_NAME: fogcache-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # Ephemeral stack: anonymous-volume (disposable) storage, readiness-gated
      # startup, and a measured bootstrap so startup time stays visible. The
      # BuildKit cache mount for ~/.m2 is per-run on fresh runners; the bulk of
      # the time is the Maven build inside the image, which is never skipped.
      - name: Bootstrap ephemeral stack
        id: stack
        run: |
          pwsh -NoProfile scripts/fogcache.ps1 bootstrap --disposable 2>&1 | tee ci-bootstrap.log
          if ! grep -q 'all services healthy' ci-bootstrap.log; then
            echo "bootstrap log missing readiness marker" >&2
            exit 1
          fi

      - name: Report startup time
        run: |
          echo "## Ephemeral stack startup (build + start + readiness wait)" >> "$GITHUB_STEP_SUMMARY"
          grep 'stack ready in' ci-bootstrap.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify seed fixtures (deterministic, checksummed)
        run: pwsh -NoProfile seed/tools/verify.ps1

      - name: End-to-end smoke (auth, routing, miss/hit, metrics)
        run: pwsh -NoProfile scripts/fogcache.ps1 smoke

      - name: Traffic scenarios (expected-outcome validation)
        run: |
          mkdir -p ci-artifacts
          python3 scripts/traffic-gen.py --scenario uniform --rate 10 --duration 15 \
            --metrics-out ci-artifacts/uniform.json --events-out ci-artifacts/uniform.jsonl
          python3 scripts/traffic-gen.py --scenario zipfian --rate 10 --duration 10 --zipf 1.5 \
            --metrics-out ci-artifacts/zipfian.json
          python3 scripts/traffic-gen.py --scenario burst --rate 5 --burst-rate 40 --duration 15 \
            --metrics-out ci-artifacts/burst.json
          python3 scripts/traffic-gen.py --scenario sequential --rate 10 --duration 10 \
            --metrics-out ci-artifacts/sequential.json
          python3 scripts/traffic-gen.py --scenario regional --rate 10 --duration 10 \
            --targets http://localhost:8081,http://localhost:8082 \
            --metrics-out ci-artifacts/regional.json
          python3 scripts/traffic-gen.py --scenario invalidation --rate 10 --duration 10 \
            --metrics-out ci-artifacts/invalidation.json
          python3 scripts/traffic-gen.py --scenario origin-fault --rate 10 --duration 10 \
            --metrics-out ci-artifacts/origin-fault.json

      # Logs, metrics, and container diagnostics are kept on any outcome so a
      # failure can be correlated to this exact run.
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts/diagnostics
          docker compose ps --format json > ci-artifacts/diagnostics/ps.json 2>&1 || true
          docker compose logs --no-color > ci-artifacts/diagnostics/compose.log 2>&1 || true
          docker inspect -f '{{.Name}} {{.State.Health.Status}}' $(docker compose ps -q) \
            > ci-artifacts/diagnostics/health.txt 2>&1 || true
          docker inspect -f '{{json .State.Health}}' $(docker compose ps -q) \
            > ci-artifacts/diagnostics/health.json 2>&1 || true

      - name: Upload diagnostics artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fogcache-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn

      # Cleanup runs on success, failure, AND cancellation (always()).
      - name: Teardown ephemeral stack
        if: always()
        run: pwsh -NoProfile scripts/fogcache.ps1 teardown --purge
