# Disposable mode override: swap named volumes for anonymous volumes so no
# data survives a teardown and every run starts from a clean slate.
#
#   docker compose -f compose.yaml -f compose.disposable.yaml up -d
#
# NOTE: anonymous volumes are chosen over tmpfs on purpose. tmpfs mounts
# cannot carry uid/gid/mode through `docker compose` (the plugin drops the
# options on every version we tested), so non-root container users (kafka
# uid 1000, prometheus nobody) could not write their data dirs and crashed
# at startup. Anonymous volumes are initialized from the image directory,
# preserving the image's ownership, and are removed by teardown --purge
# (`docker compose down -v`), so isolation is preserved.
#
# Compose override files merge services by name and replace volume mounts
# that share the same container path.

services:
  postgres:
    volumes:
      - type: volume
        target: /var/lib/postgresql/data

  redis:
    volumes:
      - type: volume
        target: /data

  kafka:
    volumes:
      - type: volume
        target: /var/lib/kafka/data

  minio:
    volumes:
      - type: volume
        target: /data

  prometheus:
    volumes:
      - type: volume
        target: /prometheus

  grafana:
    volumes:
      - type: volume
        target: /var/lib/grafana

  loki:
    volumes:
      - type: volume
        target: /loki

  tempo:
    volumes:
      - type: volume
        target: /var/tempo

  keycloak:
    volumes:
      - type: volume
        target: /opt/keycloak/data
