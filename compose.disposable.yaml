# Disposable mode override: swap named volumes for tmpfs so no data survives
# a container restart and teardown is instant.
#
#   docker compose -f compose.yaml -f compose.disposable.yaml up -d
#
# NOTE: compose override files merge services by name and replace volume mounts
# that share the same container path.

services:
  postgres:
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data

  redis:
    volumes:
      - type: tmpfs
        target: /data

  kafka:
    volumes:
      - type: tmpfs
        target: /var/lib/kafka/data

  minio:
    volumes:
      - type: tmpfs
        target: /data

  prometheus:
    volumes:
      - type: tmpfs
        target: /prometheus

  grafana:
    volumes:
      - type: tmpfs
        target: /var/lib/grafana

  loki:
    volumes:
      - type: tmpfs
        target: /loki

  tempo:
    volumes:
      - type: tmpfs
        target: /var/tempo

  keycloak:
    volumes:
      - type: tmpfs
        target: /opt/keycloak/data
