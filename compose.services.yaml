      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-fogcache}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-fogcache_dev_password}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
