# FogCache service containers for local multi-node execution.
#
# Use together with the platform stack:
#
#   docker compose -f compose.yaml -f compose.services.yaml up -d --build
#   docker compose -f compose.yaml -f compose.services.yaml -f compose.dev.yaml up -d   # dev mode
#
# Dev mode (compose.dev.yaml) bind-mounts locally built jars over the image jars,
# so `mvnw package` + `up` is a fast edit-build-run loop without rebuilding images.
#
# Every service:
#   - waits on infrastructure health checks (no fixed delays),
#   - exposes its own health check (/actuator/health),
#   - exports telemetry to the shared otel-collector,
#   - runs with spring.docker.compose disabled (the stack is managed here).

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-service-resources: &service-resources
  resources:
    limits:
      cpus: "0.5"
      memory: 768m

services:
  routing:
    build:
      context: .
      args:
        MODULE: fogcache-routing-service
    image: fogcache-routing-service:local
    container_name: fogcache-routing
    environment:
      SERVER_PORT: ${ROUTING_PORT:-8080}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      OTEL_COLLECTOR_ENDPOINT: http://otel-collector:4318
      TRACE_SAMPLING_PROBABILITY: ${TRACE_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${ROUTING_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${ROUTING_PORT:-8080}/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      <<: *service-resources
    logging: *service-logging
    networks: [fogcache-net]
    restart: unless-stopped

  edge-1:
    build:
      context: .
      args:
        MODULE: fogcache-edge-service
    image: fogcache-edge-service:local
    container_name: fogcache-edge-1
    environment:
      SERVER_PORT: ${EDGE_1_PORT:-8081}
      FOG_NODE_ID: edge-1
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      OTEL_COLLECTOR_ENDPOINT: http://otel-collector:4318
      TRACE_SAMPLING_PROBABILITY: ${TRACE_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${EDGE_1_PORT:-8081}:8081"
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${EDGE_1_PORT:-8081}/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      <<: *service-resources
    logging: *service-logging
    networks: [fogcache-net]
    restart: unless-stopped

  edge-2:
    build:
      context: .
