  content:
    build:
      context: .
      args:
        MODULE: fogcache-content-service
    image: fogcache-content-service:local
    container_name: fogcache-content
    environment:
      SERVER_PORT: ${CONTENT_PORT:-8083}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-fogcache}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-fogcache}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-fogcache_dev_password}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
