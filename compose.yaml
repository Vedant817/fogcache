name: fogcache

# Local FogCache platform data services.
#
#   Persistent mode (default):   docker compose up -d
#   Disposable mode (tmpfs):     docker compose -f compose.yaml -f compose.disposable.yaml up -d
#   Reset all data:              docker compose down -v
#
# Ports and credentials are configurable via a local `.env` file (see .env.example).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-resources: &default-resources
  resources:
    limits:
      cpus: "1.0"
      memory: 1g

networks:
  fogcache-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: fogcache-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fogcache}
      POSTGRES_USER: ${POSTGRES_USER:-fogcache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fogcache_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fogcache} -d ${POSTGRES_DB:-fogcache}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: fogcache-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    container_name: fogcache-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fogcache-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fogcache}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fogcache_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fogcache-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-fogcache} ${MINIO_ROOT_PASSWORD:-fogcache_dev_password}
        mc mb --ignore-existing local/fogcache-objects
        mc mb --ignore-existing local/fogcache-policies
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: fogcache-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: fogcache-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    container_name: fogcache-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.1
    container_name: fogcache-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    container_name: fogcache-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    deploy:
      <<: *default-resources
    logging: *default-logging
    networks: [fogcache-net]
    restart: unless-stopped
