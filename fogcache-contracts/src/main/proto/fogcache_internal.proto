syntax = "proto3";

// Internal node-to-node gRPC contracts (ADR-0005).
// Versioning: backward-compatible additions only within v1 (see docs/architecture/contract-conventions.md).
package fogcache.internal.v1;

option java_package = "io.fogcache.contracts.internal.v1";
option java_multiple_files = true;
option java_outer_classname = "FogcacheInternalProto";

// Common types --------------------------------------------------------------

message KeyRef {
  int32 key_version = 1;
  string tenant_id = 2;
  string origin_id = 3;
  string normalized_key = 4;
  string key_hash = 5; // hex sha-256 of canonical key bytes
}

message ObjectMetadata {
  KeyRef key = 1;
  int32 http_status = 2;
  map<string, string> selected_headers = 3;
  string payload_checksum = 4; // hex sha-256 of payload
  int64 payload_size = 5;      // stored bytes
  int64 uncompressed_size = 6;
  string content_type = 7;
  string content_encoding = 8;
  string etag = 9;
  string last_modified = 10;   // RFC 3339
  int64 origin_generation = 11;
  int64 entry_generation = 12;
  int64 created_at = 13;       // unix millis
  int64 expires_at = 14;
  int64 stale_while_revalidate_until = 15;
  int64 stale_if_error_until = 16;
  bool pinned = 17;
  string traffic_class = 18;   // HOT | WARM | COLD
  int32 schema_version = 19;
}

message NodeRef {
  string node_id = 1;
  string address = 2;
  int32 port = 3;
  int64 capacity_bytes = 4;
}

// MetadataService -----------------------------------------------------------

service MetadataService {
  // Look up entry metadata for a key on a remote node (used before transfer decisions).
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

message LookupRequest {
  KeyRef key = 1;
}

message LookupResponse {
  bool present = 1;
  ObjectMetadata metadata = 2;
}

// TransferService -----------------------------------------------------------

service TransferService {
  // Stream an object from owner to replica. Commit is atomic on the receiver side
  // (see docs/architecture/replication-semantics.md section 5).
  rpc Transfer(stream TransferChunk) returns (TransferResult);
}

message TransferChunk {
  oneof payload {
    TransferHeader header = 1;
    bytes data = 2;
  }
}

message TransferHeader {
  KeyRef key = 1;
  ObjectMetadata metadata = 2;
}

message TransferResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    COMMITTED = 1;
    ALREADY_CURRENT = 2;
    CHECKSUM_MISMATCH = 3;
    REJECTED = 4;
  }
  Status status = 1;
  string detail = 2;
}

// InvalidationService -------------------------------------------------------

service InvalidationService {
  // Push an invalidation generation for an origin (fallback path; Kafka is primary).
  rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);
}

message InvalidateRequest {
  string origin_id = 1;
  int64 origin_generation = 2;
  int64 origin_seq = 3;
  string kind = 4;   // EXACT | PREFIX | TAG | ORIGIN | TENANT
  string target = 5; // key hash, prefix, tag, or "*"
  string tenant_id = 6;
  string idempotency_key = 7;
}

message InvalidateResponse {
  int64 applied_origin_seq = 1;
  bool accepted = 2;
}

// ProbeService --------------------------------------------------------------

service ProbeService {
  // Node readiness probe for health checks and topology.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

message ProbeRequest {
  string node_id = 1;
}

message ProbeResponse {
  bool ready = 1;
  string status = 2;       // READY | DRAINING | NOT_READY
  int64 topology_version = 3;
  int64 capacity_bytes = 4;
  int32 protocol_version = 5;
}

// RepairService -------------------------------------------------------------

service RepairService {
  // Request repair of missing/stale replicas from the owner.
  rpc RequestRepair(RepairRequest) returns (RepairResponse);
  // Report replica state back to the owner (anti-entropy sweep results).
  rpc ReportReplicaState(ReportStateRequest) returns (ReportStateResponse);
}

message RepairRequest {
  repeated KeyRef keys = 1;
}

message RepairResponse {
  repeated KeyRef accepted = 1;
  repeated KeyRef rejected = 2;
}

message ReportStateRequest {
  NodeRef node = 1;
  repeated ObjectMetadata observed = 2;
}

message ReportStateResponse {
  int64 received = 1;
}

// PrefetchService -----------------------------------------------------------

service PrefetchService {
  rpc RequestPrefetch(PrefetchRequest) returns (PrefetchResponse);
  rpc ReportOutcome(PrefetchOutcome) returns (PrefetchOutcomeAck);
}

message PrefetchRequest {
  KeyRef key = 1;
  string reason = 2; // model_version or rule
  int64 budget_bytes = 3;
}

message PrefetchResponse {
  bool accepted = 1;
  string rejection_reason = 2; // budget | banned | duplicate
}

message PrefetchOutcome {
  KeyRef key = 1;
  bool success = 2;
  bool demanded_within_horizon = 3;
  int64 bytes_fetched = 4;
  int64 started_at = 5;
  int64 finished_at = 6;
}

message PrefetchOutcomeAck {
  bool received = 1;
}
