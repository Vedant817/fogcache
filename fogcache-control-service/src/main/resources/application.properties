spring.application.name=fogcache-control-service
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.git.enabled=true
spring.docker.compose.enabled=false

# Redis (local default; override SPRING_DATA_REDIS_HOST/PORT, e.g. to "redis" in containers).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# PostgreSQL via R2DBC (local default; override SPRING_R2DBC_* in containers).
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/fogcache}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:fogcache}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:fogcache_dev_password}

# OpenTelemetry export to the local observability stack (see compose.yaml).
# Override OTEL_COLLECTOR_ENDPOINT to disable (empty) or point elsewhere.
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/logs
management.tracing.sampling.probability=${TRACE_SAMPLING_PROBABILITY:1.0}
